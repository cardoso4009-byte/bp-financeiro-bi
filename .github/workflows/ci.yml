name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Next.js Security Gate
        run: npm run security:next:gate
      - name: Zero Difference Gate
        run: npm run financial:gate
      - name: Period Gate
        run: npm run period:gate
      - name: Integrated Financial Gate
        run: npm run integrated:gate
      - name: V2 Data Gate
        run: npm run v2:data:gate
      - name: V2 CSV Gate
        run: npm run v2:csv:gate
      - name: V2 Persistence Gate
        run: npm run v2:persistence:gate
      - name: V2 Financial Base Gate
        run: npm run v2:financial-base:gate
      - name: V2 DFC Gate
        run: npm run v2:dfc:gate
      - name: V2 BP Gate
        run: npm run v2:bp:gate
      - name: V2 DRE Gate
        run: npm run v2:dre:gate
      - name: V2 Reconciliation Gate
        run: npm run v2:reconciliation:gate
      - name: V2 Executive Cockpit Gate
        run: npm run v2:executive:gate
      - name: V2 Cost Center Gate
        run: npm run v2:cost-center:gate
      - name: V2 Management Gate
        run: npm run v2:management:gate
      - name: V2 Forecast Gate
        run: npm run v2:forecast:gate
      - name: V2 Forecast Scenario Gate
        run: npm run v2:forecast:scenario:gate
      - name: Build application
        run: npm run build
